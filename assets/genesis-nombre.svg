<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420" role="img" aria-labelledby="title desc">
  <title id="title">Génesis - Nombre / wordmark</title>
  <desc id="desc">Nombre Génesis en versión vectorial separada, con gradiente dorado y fondo transparente.</desc>
  <defs>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE28A"/>
      <stop offset="20%" stop-color="#F9C95E"/>
      <stop offset="45%" stop-color="#E9A832"/>
      <stop offset="70%" stop-color="#C97A12"/>
      <stop offset="100%" stop-color="#FFD56A"/>
    </linearGradient>
    <style>
      .title {
        font-family: "Inter Display", "Noto Sans Display", "Roboto", Arial, sans-serif;
        font-weight: 900;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
    </style>
  </defs>

  <rect width="1600" height="420" fill="none"/>
  <text x="800" y="270" text-anchor="middle" font-size="190" class="title" fill="url(#goldGrad)">GÉNESIS</text>
</svg>
