<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Génesis Impresiones 3D - Logo completo</title>
  <desc id="desc">Logo vectorial reconstruido a partir de la referencia: isotipo hexagonal con G geométrica, título Génesis, subtítulo Impresiones 3D y lema Ideas que toman forma.</desc>
  <defs>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE28A"/>
      <stop offset="20%" stop-color="#F9C95E"/>
      <stop offset="45%" stop-color="#E9A832"/>
      <stop offset="70%" stop-color="#C97A12"/>
      <stop offset="100%" stop-color="#FFD56A"/>
    </linearGradient>
    <linearGradient id="goldGrad2" x1="0" y1="0" x2="1" y2="0.8">
      <stop offset="0%" stop-color="#FFB646"/>
      <stop offset="35%" stop-color="#F6A420"/>
      <stop offset="70%" stop-color="#C9730D"/>
      <stop offset="100%" stop-color="#FFE27A"/>
    </linearGradient>
    <linearGradient id="silverGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#DADDE1"/>
      <stop offset="100%" stop-color="#F8F8F8"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF8B19"/>
      <stop offset="100%" stop-color="#F15A08"/>
    </linearGradient>
    <style>
      .title {
        font-family: "Inter Display", "Noto Sans Display", "Roboto", Arial, sans-serif;
        font-weight: 900;
        letter-spacing: 0.16em;
      }
      .sub {
        font-family: "Montserrat", "Inter", Arial, sans-serif;
        font-weight: 600;
        letter-spacing: 0.28em;
      }
      .tag {
        font-family: "Montserrat", "Inter", Arial, sans-serif;
        font-weight: 500;
        letter-spacing: 0.18em;
      }
      .caps { text-transform: uppercase; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#080808"/>

  <!-- Isotipo -->
  <g transform="translate(800 170)">
    <polygon points="0,-120 104,-60 104,60 0,120 -104,60 -104,-60"
             fill="none" stroke="url(#goldGrad)" stroke-width="28" stroke-linejoin="round"/>
    <path d="M -4,-54 L 48,-24 L 20,-10 L -8,-26 L -46,-4 L -46,40 L -8,62 L 52,28 L 0,28 L 0,-2 L 96,-2 L 96,58 L -8,116 L -74,78 L -74,-20 L -4,-54 Z"
          fill="url(#goldGrad2)"/>
  </g>

  <!-- Nombre principal -->
  <text x="800" y="500" text-anchor="middle" font-size="148" class="title caps" fill="url(#goldGrad)">GÉNESIS</text>

  <!-- Subtitulo -->
  <line x1="290" y1="568" x2="424" y2="568" stroke="url(#orangeGrad)" stroke-width="4"/>
  <line x1="1176" y1="568" x2="1310" y2="568" stroke="url(#orangeGrad)" stroke-width="4"/>
  <text x="800" y="586" text-anchor="middle" font-size="66" class="sub caps" fill="url(#silverGrad)">IMPRESIONES 3D</text>

  <!-- Tagline -->
  <text x="760" y="668" text-anchor="end" font-size="46" class="tag caps" fill="#F0F0F0">IDEAS QUE</text>
  <text x="790" y="668" text-anchor="start" font-size="46" class="tag caps" fill="url(#orangeGrad)">TOMAN FORMA</text>
</svg>
